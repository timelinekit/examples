<div class="app">
  <h1>TimelineKit - Gantt Chart</h1>
  <div class="toolbar">
    <button (click)="onZoomIn()">Zoom In</button>
    <button (click)="onZoomOut()">Zoom Out</button>
    <button (click)="onZoomToFit()">Zoom to Fit</button>
    <button (click)="onUndo()">Undo</button>
    <button (click)="onRedo()">Redo</button>
  </div>
  @if (clickedTask) {
    <div class="status-bar">{{ clickedTask }}</div>
  }
  <div class="gantt-container">
    <gk-gantt-chart></gk-gantt-chart>
  </div>
</div>
